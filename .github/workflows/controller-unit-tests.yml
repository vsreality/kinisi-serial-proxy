name: Serial proxy pre-merge tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Controller unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install proxy dependencies
        run: python -m pip install -r requirements.txt
      - name: Run proxy and Linux process-control unit tests
        run: |
          python - <<'PY'
          import sys
          import unittest

          loader = unittest.defaultTestLoader
          for filename in ('test_proxy.py', 'test_proxyctl.py'):
              if not loader.discover('tests', pattern=filename).countTestCases():
                  sys.exit(f'No tests collected from {filename}')
          suite = loader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              sys.exit(f'Unexpected skipped tests: {result.skipped}')
          sys.exit(0 if result.testsRun and result.wasSuccessful() else 1)
          PY
